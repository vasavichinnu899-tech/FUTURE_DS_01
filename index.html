<!DOCTYPE html>
<html>
<head>
    <title>Power BI Style Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0b1220;
            color: white;
        }

        .header {
            background: #111827;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: #0f172a;
        }

        select {
            padding: 8px;
            border-radius: 6px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 15px;
        }

        .card {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .card h2 {
            color: #38bdf8;
        }

        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            padding: 15px;
        }

        .box {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th, td {
            border: 1px solid #334155;
            padding: 6px;
            text-align: center;
        }

        th {
            background: #0f172a;
        }
    </style>
</head>

<body>

<div class="header">Sales Analytics Dashboard (Power BI Style)</div>

<div class="filters">
    <select id="productFilter" onchange="updateDashboard()">
        <option value="All">All Products</option>
    </select>

    <select id="regionFilter" onchange="updateDashboard()">
        <option value="All">All Regions</option>
    </select>
</div>

<div class="cards">
    <div class="card">
        <div>Total Revenue</div>
        <h2 id="revenue">0</h2>
    </div>

    <div class="card">
        <div>Top Product</div>
        <h2 id="topProduct">-</h2>
    </div>

    <div class="card">
        <div>Top Customer</div>
        <h2 id="topCustomer">-</h2>
    </div>

    <div class="card">
        <div>Top Region</div>
        <h2 id="topRegion">-</h2>
    </div>
</div>

<div class="grid">

    <div class="box">
        <canvas id="lineChart"></canvas>
        <canvas id="barChart"></canvas>
        <canvas id="pieChart"></canvas>
    </div>

    <div class="box">
        <table>
            <thead>
                <tr>
                    <th>ID</th><th>Customer</th><th>Product</th>
                    <th>Region</th><th>Qty</th><th>Price</th><th>Date</th>
                </tr>
            </thead>
            <tbody id="table"></tbody>
        </table>
    </div>

</div>

let filtered = [...sales];

function compute(data) {

    let revenue = 0;
    let product = {};
    let customer = {};
    let region = {};
    let month = {};

    data.forEach(s => {
        let total = s.qty * s.price;
        revenue += total;

        product[s.product] = (product[s.product] || 0) + total;
        customer[s.customer] = (customer[s.customer] || 0) + total;
        region[s.region] = (region[s.region] || 0) + total;

        let m = s.date.substring(0,7);
        month[m] = (month[m] || 0) + total;
    });

    let top = (obj) => Object.keys(obj).reduce((a,b)=>obj[a]>obj[b]?a:b);

    document.getElementById("revenue").innerText = revenue;
    document.getElementById("topProduct").innerText = top(product);
    document.getElementById("topCustomer").innerText = top(customer);
    document.getElementById("topRegion").innerText = top(region);

    drawTable(data);
    drawCharts(month, product, region);
}

function drawTable(data) {
    let t = "";
    data.forEach(s=>{
        t += `<tr>
            <td>${s.id}</td>
            <td>${s.customer}</td>
            <td>${s.product}</td>
            <td>${s.region}</td>
            <td>${s.qty}</td>
            <td>${s.price}</td>
            <td>${s.date}</td>
        </tr>`;
    });
    document.getElementById("table").innerHTML = t;
}

let line, bar, pie;

function drawCharts(month, product, region) {

    if(line) line.destroy();
    if(bar) bar.destroy();
    if(pie) pie.destroy();

    line = new Chart(document.getElementById("lineChart"), {
        type: "line",
        data: {
            labels: Object.keys(month),
            datasets: [{ data: Object.values(month) }]
        }
    });

    bar = new Chart(document.getElementById("barChart"), {
        type: "bar",
        data: {
            labels: Object.keys(product),
            datasets: [{ data: Object.values(product) }]
        }
    });

    pie = new Chart(document.getElementById("pieChart"), {
        type: "pie",
        data: {
            labels: Object.keys(region),
            datasets: [{ data: Object.values(region) }]
        }
    });
}

function initFilters() {

    let p = new Set();
    let r = new Set();

    sales.forEach(s=>{
        p.add(s.product);
        r.add(s.region);
    });

    let pf = document.getElementById("productFilter");
    let rf = document.getElementById("regionFilter");

    p.forEach(x=> pf.innerHTML += `<option>${x}</option>`);
    r.forEach(x=> rf.innerHTML += `<option>${x}</option>`);
}

function updateDashboard() {

    let p = document.getElementById("productFilter").value;
    let r = document.getElementById("regionFilter").value;

    filtered = sales.filter(s =>
        (p === "All" || s.product === p) &&
        (r === "All" || s.region === r)
    );

    compute(filtered);
}

initFilters();
compute(sales);

</script>
